<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ConverFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/marketing.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2309090b'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
<style>
.form-group { margin-bottom: 18px; text-align: left; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: #09090b; margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 14px; border: 1px solid #e4e4e7; border-radius: 6px; font-size: 14px; outline: none; background: #fff; color: #09090b; transition: all 120ms; }
.form-input:focus { border-color: #09090b; box-shadow: 0 0 0 1px #09090b; }
.btn-block { width: 100%; }
.auth-footer { margin-top: 24px; font-size: 13px; color: #71717a; text-align: center; }
.auth-footer a { color: #09090b; font-weight: 600; text-decoration: underline; }
#loginError { font-size: 13px; color: #dc2626; margin-top: 12px; display: none; text-align: center; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      ConverFlow
    </a>
    <div class="nav-cta">
      <a href="/signup" class="btn btn-black btn-sm">Create Account</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-mark" style="margin:0 auto"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-subtitle">Sign in to your ConverFlow console</div>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="name@company.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-black btn-lg btn-block" id="btnLogin">Sign in to Dashboard</button>
      <div id="loginError"></div>
    </form>

    <div class="auth-footer">
      New to ConverFlow? <a href="/signup">Start 15-day free trial</a>
    </div>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/dashboard';
    } else {
      err.textContent = data.error || 'Invalid email or password';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in to Dashboard';
    }
  } catch (ex) {
    err.textContent = 'Network error. Please try again.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in to Dashboard';
  }
}
</script>
</body>
</html>
