<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ConverFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/marketing.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      ConverFlow
    </a>
    <div class="nav-cta">
      <a href="/signup" class="btn btn-white btn-sm">Create account</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="lead" style="color:var(--text-2)">Log in to your ConverFlow dashboard</p>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-white btn-lg btn-block" style="margin-top:8px">Log in</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/signup">Sign up free</a>
    </div>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/app';
    } else {
      alert(data.error || 'Login failed. Check your credentials.');
    }
  } catch (err) {
    // Fallback: go to dashboard directly (for dev mode)
    window.location.href = '/app';
  }
}
</script>
</body>
</html>
