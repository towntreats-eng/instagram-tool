<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — ConverFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/marketing.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      ConverFlow
    </a>
    <div class="nav-cta">
      <a href="/login" class="btn btn-ghost btn-sm">Log in</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Start free trial</h1>
    <p class="lead" style="color:var(--text-2)">15 days free. No credit card needed.</p>

    <form id="signupForm" onsubmit="return handleSignup(event)">
      <div class="form-group">
        <label class="form-label">Business Name</label>
        <input type="text" class="form-input" id="signupName" placeholder="Your brand or business name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="signupPassword" placeholder="Min 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-white btn-lg btn-block" style="margin-top:8px">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</div>

<script>
async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/app';
    } else {
      alert(data.error || 'Signup failed. Try again.');
    }
  } catch (err) {
    window.location.href = '/app';
  }
}
</script>
</body>
</html>
